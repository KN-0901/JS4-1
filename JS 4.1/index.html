<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <style>
        body {
            background-color: #e2c8ac;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .app-container {
            background-color: #ffb764d3;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 6px 12px rgba(0, 54, 115, 0.15);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #080808;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #080808;
            border-radius: 8px;
            outline: none;
        }
        .add-btn {
            font-size: 1rem;
            padding: 12px 20px;
            background-color: e2c8ac;
            color: #080808;
            border: 2px solid #080808;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .add-btn:hover {
            background-color: #ffb764d3;
            color: #0f0f0fd3;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }
        li {
            background-color: #f0f7ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #000000;
            border-left: 4px solid #030303;
        }
        .remove-btn {
            background-color: #ffcccc;
            color: #f59e7c;
            border: 1px solid #ff9999;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .remove-btn:hover {
            background-color: #ff9999;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>To-Do List</h1>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button class="add-btn" onclick="addTask()">Add Task</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
